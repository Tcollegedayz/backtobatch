<!doctype html><html lang="en"><head><title>Log In — BackToBatch</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b4bdb">
<link rel="stylesheet" href="assets/style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script defer src="assets/config.js"></script><script defer src="assets/app.js"></script></head><body><div class="demo-note">Live Supabase authentication enabled</div>
<nav class="navbar"><div class="container nav-inner">
<a class="brand" href="index.html"><span class="brand-mark">B</span><span>BackToBatch</span></a>
<div class="nav-links"><a href="index.html#features">Features</a><a href="dashboard.html" data-auth="user" class="hidden">Dashboard</a></div>
<div class="nav-actions">
<a class="btn btn-light" href="login.html" data-auth="guest">Log in</a>
<a class="btn btn-primary" href="register.html" data-auth="guest">Join Free</a>
<a class="btn btn-light hidden" href="dashboard.html" data-auth="user">My Account</a>
<button class="btn btn-danger hidden" data-auth="user" onclick="logout()">Log out</button>
</div></div></nav>
<div class="auth-shell"><div class="auth-card"><div class="eyebrow">Welcome back</div><h1>Log in</h1><p class="muted">Continue rebuilding your batch community.</p>
<div id="loginMessage" class="alert"></div>
<form id="loginForm" class="stack"><label>Email<input class="input" id="email" type="email" required></label><label>Password<input class="input" id="password" type="password" required></label><button id="loginBtn" class="btn btn-primary btn-block">Log In</button></form>
<p class="center muted">New here? <a class="link" href="register.html">Create an account</a></p></div></div><footer><div class="container footer-inner"><div class="brand"><span class="brand-mark">B</span><span>BackToBatch</span></div><div>© 2026 BackToBatch. Every batch has someone missing.</div></div></footer>
<script>
const hashParams=new URLSearchParams(location.hash.substring(1));if(hashParams.get('error_description'))showMessage('loginMessage',hashParams.get('error_description'));
document.getElementById('loginForm').addEventListener('submit',async(e)=>{
 e.preventDefault();const btn=document.getElementById('loginBtn');btn.classList.add('loading');btn.textContent='Logging in...';
 const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
 btn.classList.remove('loading');btn.textContent='Log In';
 if(error)return showMessage('loginMessage',error.message);
 location.href='dashboard.html';
});
</script></body></html>
