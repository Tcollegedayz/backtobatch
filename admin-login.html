<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — BackToBatch</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script defer src="assets/config.js"></script>
<script defer src="assets/app.js"></script>
</head>
<body>
<div class="demo-note">BackToBatch secure administration</div>
<nav class="navbar"><div class="container nav-inner">
<a class="brand" href="index.html"><span class="brand-mark">B</span><span>BackToBatch</span></a>
<div class="nav-actions"><a class="btn btn-light" href="index.html">Main Website</a></div>
</div></nav>

<div class="auth-shell"><div class="auth-card">
<div class="eyebrow">Restricted access</div>
<h1>Administrator login</h1>
<p class="muted">Use your approved administrator account.</p>
<div id="adminLoginMessage" class="alert"></div>

<form id="adminLoginForm" class="stack">
<label>Email<input class="input" id="email" type="email" required></label>
<label>Password<input class="input" id="password" type="password" required></label>
<button id="loginBtn" class="btn btn-primary btn-block">Open Admin Panel</button>
</form>
<p class="center muted"><a class="link" href="login.html">Regular user login</a></p>
</div></div>

<script>
window.addEventListener('load',async()=>{
  const existing=await getSession();
  if(existing){
    const access=await checkAdminAccess();
    if(access.allowed) location.href='admin-dashboard.html';
  }
});

document.getElementById('adminLoginForm').addEventListener('submit',async(e)=>{
  e.preventDefault();

  const btn=document.getElementById('loginBtn');
  btn.classList.add('loading');
  btn.textContent='Checking access...';

  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value
  });

  if(error){
    btn.classList.remove('loading');
    btn.textContent='Open Admin Panel';
    return showMessage('adminLoginMessage',error.message);
  }

  const access=await checkAdminAccess();

  btn.classList.remove('loading');
  btn.textContent='Open Admin Panel';

  if(access.error){
    await sb.auth.signOut();
    return showMessage('adminLoginMessage','Admin access check failed: '+access.error);
  }

  if(!access.allowed){
    await sb.auth.signOut();
    return showMessage(
      'adminLoginMessage',
      access.suspended
        ? 'This administrator account is suspended.'
        : 'This account does not have administrator access.'
    );
  }

  location.href='admin-dashboard.html';
});
</script>
</body>
</html>
